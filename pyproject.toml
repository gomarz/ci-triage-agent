[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "Agentic triage for CI failures: ingest, cluster, and propose verified fixes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic (>=1.8,<2)",
]

[tool.poetry]
packages = [{ include = "ci_triage", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.5"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
